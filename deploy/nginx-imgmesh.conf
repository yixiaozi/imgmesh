server {
    listen 80;
    listen [::]:80;
    server_name imgmesh.com www.imgmesh.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        root /var/www/imgmesh;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
