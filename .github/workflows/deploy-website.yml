name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-imgmesh-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Compile API
        working-directory: server
        run: CGO_ENABLED=0 go build -o ../imgmesh-api ./cmd/imgmesh-api

      - name: Build viewer
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compile viewer
        working-directory: web
        run: npm ci && npm test && npm run build

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync site, viewer, and API
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          rsync -avz -e "$SSH" index.html styles.css favicon.svg "${SSH_USER}@${SSH_HOST}:/var/www/imgmesh/"
          rsync -avz --delete -e "$SSH" web/dist/ "${SSH_USER}@${SSH_HOST}:/var/www/imgmesh/s/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            imgmesh-api \
            deploy/imgmesh-api.service \
            deploy/nginx-imgmesh-locations.conf \
            deploy/remote-setup.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/"
          $SSH "${SSH_USER}@${SSH_HOST}" "install -m 755 /tmp/imgmesh-api /usr/local/bin/imgmesh-api && chmod 755 /tmp/remote-setup.sh && bash /tmp/remote-setup.sh"
