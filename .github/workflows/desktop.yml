name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "web/src/crypto.ts"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/src/crypto.ts"
      - ".github/workflows/desktop.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: imgmesh-${{ matrix.name }}
          path: desktop/release/*
          if-no-files-found: error
