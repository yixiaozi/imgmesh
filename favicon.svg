<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imgmesh">
  <!-- soft paper tile -->
  <rect width="64" height="64" rx="14" fill="#0e6b6e"/>
  <!-- photo card -->
  <rect x="10" y="12" width="28" height="22" rx="4" fill="#e9f5f4"/>
  <path d="M10 28.5 18.5 20l5.5 5 4.5-6.5L38 28.5Z" fill="#0a4f52"/>
  <circle cx="31.5" cy="18.5" r="2.4" fill="#c4a882"/>
  <!-- mesh / distribution rays from photo to nodes -->
  <g stroke="#b8d4d2" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M38 23h7.5"/>
    <path d="M36.5 30.5 46 38"/>
    <path d="M24 34v7.5"/>
  </g>
  <!-- destination nodes (recipients / mesh) -->
  <circle cx="50" cy="23" r="5.2" fill="#e9f5f4"/>
  <circle cx="50" cy="23" r="2.1" fill="#0e6b6e"/>
  <circle cx="49.5" cy="41" r="5.2" fill="#e9f5f4"/>
  <circle cx="49.5" cy="41" r="2.1" fill="#0e6b6e"/>
  <circle cx="24" cy="46.5" r="5.2" fill="#e9f5f4"/>
  <circle cx="24" cy="46.5" r="2.1" fill="#0e6b6e"/>
  <!-- faint mesh links between nodes -->
  <g stroke="#7aa8a3" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <path d="M50 28.2 49.5 35.8"/>
    <path d="M44.3 41.8 29.2 46.5"/>
  </g>
</svg>
