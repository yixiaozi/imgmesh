<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imgmesh">
  <defs>
    <linearGradient id="g" x1="12" y1="10" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14949a"/>
      <stop offset="1" stop-color="#0a4f52"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!--
    One mark: a photo plane whose surface IS a mesh.
    Facets read as landscape; vertices/edges read as distribution network.
  -->
  <g fill="none" stroke="#e9f5f4" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- outer photo frame (soft, shared with mesh) -->
    <path d="M14 18.5c0-1.4 1.1-2.5 2.5-2.5h31c1.4 0 2.5 1.1 2.5 2.5v27c0 1.4-1.1 2.5-2.5 2.5h-31c-1.4 0-2.5-1.1-2.5-2.5z" opacity="0.35"/>
    <!-- mesh lattice forming image content -->
    <path d="M16.5 42.5 27 24.5 37.5 35 47.5 21.5 49.5 42.5"/>
    <path d="M16.5 42.5h33"/>
    <path d="M27 24.5 22 42.5"/>
    <path d="M27 24.5 32.5 42.5"/>
    <path d="M37.5 35 32.5 42.5"/>
    <path d="M37.5 35 42.5 42.5"/>
    <path d="M47.5 21.5 42.5 42.5"/>
    <path d="M16.5 34.5 27 24.5"/>
    <path d="M47.5 21.5 49.5 34"/>
  </g>
  <!-- mesh nodes (same weight family as lines — not separate UI chrome) -->
  <g fill="#e9f5f4">
    <circle cx="27" cy="24.5" r="2.15"/>
    <circle cx="37.5" cy="35" r="2.15"/>
    <circle cx="47.5" cy="21.5" r="2.15"/>
    <circle cx="16.5" cy="42.5" r="1.85"/>
    <circle cx="32.5" cy="42.5" r="1.85"/>
    <circle cx="49.5" cy="42.5" r="1.85"/>
  </g>
</svg>
